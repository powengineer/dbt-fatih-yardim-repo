# schema.yml
version: 2

sources:
  - name: raw               # Artık kaynak adı gz_raw_data değil → raw
    schema: gz_raw_data     # BigQuery dataset burada duruyor
    description: >
      Raw data loaded from Greenweez source systems.
      These tables contain untransformed transactional data.
    
    tables:
      - name: raw_gz_sales  # Gerçek tablo adı
        alias: sales        # DBT'de kullanacağın takma ad
        
      - name: raw_gz_product
        alias: product

      - name: raw_gz_ship
        alias: ship